# Local, reproducible full-stack run.
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
# Then open http://localhost:5173
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell or a .env file}
      VISION_MODEL: ${VISION_MODEL:-claude-sonnet-5}
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /data/uploads
      DB_PATH: /data/analyses.db
    volumes:
      - analyzer-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  analyzer-data:
