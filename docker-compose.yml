# Local, reproducible full-stack run — mirrors prod (Postgres + migrations).
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up --build
# Then open http://localhost:5173
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
      POSTGRES_DB: analyzer
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      # Named Dockerfile.local so Railway's builder ignores it (Railway uses
      # Nixpacks via railway.json); this file is only for local docker compose.
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell or a .env file}
      VISION_MODEL: ${VISION_MODEL:-claude-sonnet-5}
      CORS_ORIGINS: http://localhost:5173
      DATABASE_URL: postgresql+asyncpg://analyzer:analyzer@postgres:5432/analyzer
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg-data:
  uploads-data:
